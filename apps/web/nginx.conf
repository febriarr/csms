# Serves the dashboard and forwards /api to the backend container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's own DNS. With a variable in proxy_pass, nginx looks the name up again instead of keeping the address
    # from start-up, so a recreated backend container is found without restarting nginx.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API runs with TRUST_PROXY=1 and reads the client address from this header. nginx appends the address
        # it saw to whatever the client sent, so a faked header does not become the client address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/events/device-status is a server-sent events stream: no buffering, and no 60 s read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        client_max_body_size 1m;
    }

    # Files in /assets have a hash in their name: cache them for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Routes such as /dashboard/monitoring/live exist only in the browser: answer with index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}