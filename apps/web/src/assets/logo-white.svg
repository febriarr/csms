<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1230" width="1280" height="1230">
  <defs>
    <linearGradient id="gTop" x1="170" y1="420" x2="860" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aaaaaa"/>
