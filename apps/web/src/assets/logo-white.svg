  <!-- Pita bawah -->
  <path d="M155,590 L155,790 Q155,870 215,915 L560,1150 Q650,1190 740,1150 L885,1068 L625,935 L385,780 L190,645 Q160,625 155,590 Z" fill="url(#gBottom)"/>
  <!-- Lengan kanan bawah -->
  <path d="M625,935 L940,785 Q965,770 995,790 L1115,860 Q1150,890 1125,925 L885,1068 Q840,1085 800,1060 Z" fill="url(#gArmBottom)"/>

