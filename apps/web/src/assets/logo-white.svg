  <!-- Kepingan salju: garis utama -->
  <g stroke-width="46" stroke-linecap="round" fill="none">
    <path d="M437,530 L858,752" stroke="url(#gMain)"/>
    <path d="M437,752 L858,530" stroke="url(#gMain)"/>
    <path d="M648,391 L648,874" stroke="url(#gVert)"/>
