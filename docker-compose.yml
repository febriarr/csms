# CSMS: PostgreSQL, API and dashboard.
#
#   cp .env.example .env     # then fill in the secrets
#   docker compose up -d --build
#   docker compose run --rm seed                  # first super admin, once
#
# Only the web container is published, on 127.0.0.1:<WEB_PORT>. Put a reverse proxy with HTTPS in front of it
# (see docs/deployment.md). It serves the dashboard and forwards /api to the backend, so the browser sees one
# origin and the devices post to the same address: <PUBLIC_URL>/api/temperature

name: csms

services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-csms}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            POSTGRES_DB: ${POSTGRES_DB:-csms}
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            # -h 127.0.0.1 makes it a TCP check. On the first start the image runs a temporary server that listens on the
            # socket only, and a socket check passes while other containers still cannot connect.
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    # Runs once, then exits. The backend starts only after it succeeded.
    migrate:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        image: csms-backend
        command: ["node", "dist/database/migrate.js"]
        restart: "no"
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER:-csms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-csms}
        depends_on:
            db:
                condition: service_healthy

    backend:
        image: csms-backend
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: "3000"
            DATABASE_URL: postgres://${POSTGRES_USER:-csms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-csms}
            # The address people type in the browser. The same value three times, because nginx makes web and API one origin.
            WEB_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
            BETTER_AUTH_URL: ${PUBLIC_URL}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
            DEVICE_API_KEY: ${DEVICE_API_KEY:?set DEVICE_API_KEY in .env}
            # proxies in front of the API: the nginx in the web container, plus the one that terminates TLS
            TRUST_PROXY: ${TRUST_PROXY:-2}
            THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
            THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-10}
            WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
            WHATSAPP_AUTH_DIR: .baileys_auth
        volumes:
            - whatsapp-auth:/app/.baileys_auth
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        healthcheck:
            # 200 for ok and degraded, 503 only when the database is down. The slim image has no curl, node does the request.
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    # Not started by `up`. Creates the first super admin (username `febri`, email superadmin@csms.local):
    #   docker compose run --rm seed
    seed:
        image: csms-backend
        profiles: ["tools"]
        command: ["node", "dist/database/seed.js"]
        restart: "no"
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER:-csms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-csms}
            BETTER_AUTH_URL: ${PUBLIC_URL}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
        depends_on:
            migrate:
                condition: service_completed_successfully

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        image: csms-web
        restart: unless-stopped
        ports:
            # Loopback by default: a reverse proxy on the same host (Caddy, nginx, cloudflared) terminates TLS and is the
            # only way in. Set WEB_BIND=0.0.0.0 to open the port to the network (plain HTTP, see docs/deployment.md).
            - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
        depends_on:
            backend:
                condition: service_healthy

volumes:
    db-data:
    whatsapp-auth:
